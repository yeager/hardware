name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: Install build frontend
        run: python -m pip install build
      - name: Build wheel and source archive
        run: ./build.sh
      - name: Install wheel and smoke test
        run: |
          python -m pip install --no-deps --target "$RUNNER_TEMP/hardware-install" dist/*.whl
          PYTHONPATH="$RUNNER_TEMP/hardware-install" python -m hardware.app --json > "$RUNNER_TEMP/inventory.json"
          python -c 'import json,sys; data=json.load(open(sys.argv[1])); assert {"system", "devices", "counts", "kernel"} <= data.keys()' "$RUNNER_TEMP/inventory.json"
      - name: Check wheel contents
        run: python -c 'import glob,zipfile; z=zipfile.ZipFile(glob.glob("dist/*.whl")[0]); names=z.namelist(); assert any(n.endswith("hardware.mo") for n in names); assert any(n.endswith("se.yeager.Hardware.desktop") for n in names); assert any(n.endswith("se.yeager.Hardware.png") for n in names)'
      - uses: actions/upload-artifact@v4
        with:
          name: hardware-distributions
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hardware-distributions
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Hardware ${GITHUB_REF_NAME#v}" --generate-notes
