[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hardware"
version = "0.1.0"
description = "GNOME app for hardware and driver inventory"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
hardware = "hardware.app:main"

[tool.setuptools]
packages = ["hardware"]

[tool.setuptools.package-data]
hardware = ["locale/sv/LC_MESSAGES/*.mo"]

[tool.setuptools.data-files]
"share/applications" = ["se.yeager.Hardware.desktop"]
